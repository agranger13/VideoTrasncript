version: '3.8'

services:
  video-optimizer:
    build:
      context: ./
      dockerfile: Dockerfile
    image: <AWS_ACCOUNT_ID>.dkr.ecr.<AWS_REGION>.amazonaws.com/bulle/videotrasncript-video-optimizer:latest
    container_name: video-optimizer-api
    restart: unless-stopped
    ports:
      - "80:5000"
    volumes:
      - ./videos/input:/app/input:rw
      - ./videos/output:/app/output:rw
      - ./videos/temp:/app/temp:rw
      - ./logs:/app/logs:rw
      - ~/.aws:/root/.aws:ro
    environment:
      - FLASK_ENV=production
      - FLASK_APP=app.py
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-eu-west-1}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME}
      - MAX_FILE_SIZE=500MB
      - ALLOWED_EXTENSIONS=mp4,avi,mov,mkv,webm,flv
      - DEFAULT_CODEC=libx264
      - DEFAULT_PRESET=medium
      - DEFAULT_CRF=23
      - MAX_CONCURRENT_JOBS=1
      - CLEANUP_TEMP_FILES=true
      - SVT_AV1_THREADS=0
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 512M
    networks:
      - video-network

networks:
  video-network:
    driver: bridge

